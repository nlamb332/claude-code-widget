[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "usage-rings"
version = "0.2.0"
description = "Standalone Windows desktop app for Claude Code and Codex usage rings"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6",
]

[project.scripts]
usage-rings = "usage_rings.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
